<meta charset="utf-8">
<title>Игра для Сашули</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
/* Layout: one phone screen like a tape playback — counter strip on top, the puppet and its words in the middle, controls at the thumb. Single dark world; the finale flips to warm light. */
:root {
  color-scheme: dark;
  --bg: #0c0b0a;
  --ink: #e9e3d7;
  --dim: #958d80;
  --line: #2c2824;
  --paper: #e6dfd1;
  --paper-ink: #1d1a17;
  --blood: #a3191b;
  --blood-hi: #d6282b;
  --gold: #f1c27a;
  --warm: #3a1f0c;
  --display: "Cormorant Garamond", "Times New Roman", Georgia, serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--body);
  font-size: 15px;
  overflow: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color: transparent;
}
body::after {
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 4;
  background: radial-gradient(ellipse at 50% 42%, transparent 45%, rgba(0,0,0,.72) 100%);
}
#grain { position: fixed; inset: 0; width: 100%; height: 100%; opacity: .07; pointer-events: none; z-index: 5; mix-blend-mode: screen; image-rendering: pixelated; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

.screen { height: 100%; display: flex; flex-direction: column; position: relative; z-index: 1; }

/* wake */
#s-wake { align-items: center; justify-content: center; text-align: center; gap: 18px; border: 0; background: transparent; width: 100%; }
#s-wake .call { font-family: var(--display); font-style: italic; font-weight: 500; font-size: clamp(1.5rem, 6.4vw, 2.1rem); line-height: 1.3; max-width: 18ch; text-wrap: balance; animation: flick 6s infinite steps(1); }
#s-wake .sub { font-family: var(--mono); font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--dim); }
#s-wake.grind { animation: rattle .09s infinite; }
#s-wake.grind .call, #s-wake.grind .sub { opacity: 0; transition: opacity 1.2s; }

/* play */
.bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 14px 8px; font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); font-variant-numeric: tabular-nums; }
.bar .rec { display: inline-flex; align-items: center; gap: 7px; color: var(--blood-hi); }
.bar .rec i { width: 8px; height: 8px; border-radius: 50%; background: var(--blood-hi); animation: blink 1.2s infinite steps(1); }
#lbl { background: none; border: 0; padding: 4px 0; letter-spacing: inherit; text-transform: inherit; color: var(--ink); }
.stage { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; align-items: center; gap: 18px; padding-block: 6px 18px; scrollbar-width: none; }
.stage::-webkit-scrollbar { display: none; }
.stage > * { flex-shrink: 0; }
#face { width: min(40vw, 170px); height: auto; flex: none; filter: drop-shadow(0 0 34px rgba(163,25,27,.2)); animation: flick 9s infinite steps(1); }
#face .skin { fill: url(#skin); }
#face .dark { fill: #0c0b0a; }
#face .hair { fill: #151311; }
#face .bl { fill: var(--blood); }
#face .bl-hi { fill: var(--blood-hi); }
#face .spiral { fill: none; stroke: var(--blood); stroke-width: 2.4; stroke-linecap: round; }
#face .crease { fill: none; stroke: #2c2824; stroke-width: 1.6; }
#jaw { transform-box: fill-box; }
#face.talk #jaw { animation: jaw .17s ease-in-out infinite alternate; }

#subs { width: 100%; max-width: 30ch; display: flex; flex-direction: column; gap: 6px; text-align: center; min-height: 3em; }
#subs p { margin: 0; font-family: var(--display); font-weight: 500; font-size: clamp(1.3rem, 5.6vw, 1.7rem); line-height: 1.3; text-wrap: balance; animation: rise .5s ease-out; transition: opacity .4s; }
#subs p.past { opacity: .36; }

.panel { width: 100%; max-width: 400px; display: grid; gap: 14px; justify-items: center; }
.panel.shake { animation: shake .4s; }
.note { background: var(--paper); color: var(--paper-ink); padding: 14px 18px 16px; transform: rotate(-1.2deg); box-shadow: 0 8px 24px rgba(0,0,0,.5); font-family: var(--mono); font-size: 1.05rem; letter-spacing: .06em; text-align: center; max-width: 100%; overflow-wrap: anywhere; white-space: pre-line; line-height: 1.6; }
.note small { display: block; font-size: 10px; letter-spacing: .2em; text-transform: uppercase; opacity: .55; margin-bottom: 6px; }

.cells-wrap { position: relative; display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
.cells-group { display: flex; gap: 6px; }
.cell { width: 2.6rem; height: 3.2rem; display: grid; place-items: center; border: 1px solid var(--line); background: #141210; font-family: var(--mono); font-size: 1.5rem; font-weight: 500; color: var(--ink); transition: border-color .2s; }
.cells-wrap.word .cell { width: 2.1rem; height: 2.8rem; font-size: 1.25rem; }
.cell.on { border-color: var(--dim); }
.cell.full { border-color: var(--blood); }
.cells-input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; font-size: 16px; border: 0; background: transparent; color: transparent; caret-color: transparent; }
.cells-label { font-family: var(--mono); font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--dim); }
.msg { min-height: 1.4em; margin: 0; font-family: var(--display); font-style: italic; font-size: 1.15rem; color: var(--blood-hi); text-align: center; }
.hint { margin: 0; font-family: var(--display); font-style: italic; font-size: 1.15rem; color: var(--ink); text-align: center; border-top: 1px solid var(--line); padding-top: 12px; max-width: 30ch; }

.btn { border: 0; background: var(--blood); color: #fff4e6; padding: 14px 26px; font-family: var(--mono); font-size: 13px; font-weight: 500; letter-spacing: .16em; text-transform: uppercase; min-width: 12rem; }
.btn:active { background: var(--blood-hi); }
.btn:disabled { background: #3a2a29; color: #c2b9ab; }
.ghost { border: 1px solid var(--line); background: transparent; padding: 10px 14px; font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); }
.ghost:active { color: var(--ink); border-color: var(--dim); }
.foot { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; padding-block: 8px 14px; min-height: 58px; }

.polaroid { margin: 0; background: var(--paper); padding: 10px 10px 12px; width: min(72vw, 260px); transform: rotate(2deg); box-shadow: 0 10px 30px rgba(0,0,0,.6); position: relative; }
.polaroid::before { content: ""; position: absolute; top: -10px; left: 50%; width: 70px; height: 20px; transform: translateX(-50%) rotate(-3deg); background: rgba(230,223,209,.55); }
.polaroid .ph { aspect-ratio: 4 / 3; max-width: 100%; background: #2a2622; display: grid; place-items: center; color: var(--dim); font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; text-align: center; padding: 8px; overflow: hidden; }
.polaroid .ph img { width: 100%; height: 100%; object-fit: cover; }
.polaroid figcaption { color: var(--paper-ink); font-family: var(--display); font-style: italic; font-size: 1.2rem; text-align: center; padding-top: 8px; }

.vid { width: min(62vw, 240px); aspect-ratio: 9 / 16; max-height: 46vh; max-width: 100%; background: #000; border: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; padding: 14px; }
.vid b { font-family: var(--mono); font-weight: 500; font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--blood-hi); }
.vid span { font-family: var(--display); font-style: italic; font-size: 1.15rem; color: var(--ink); }
.vid .prog { width: 70%; height: 2px; background: var(--line); overflow: hidden; }
.vid .prog i { display: block; height: 100%; width: 100%; background: var(--ink); transform-origin: left; animation: prog 4s linear forwards; }
video.real { width: min(72vw, 280px); max-height: 52vh; max-width: 100%; background: #000; }
.live { font-family: var(--display); font-style: italic; font-size: 1.2rem; text-align: center; color: var(--dim); margin: 0; }

/* final */
#s-final { align-items: center; justify-content: center; text-align: center; gap: 16px; background: var(--bg); transition: background 2.4s ease; }
#s-final h1 { margin: 0; font-family: var(--display); font-weight: 600; font-size: clamp(2.6rem, 13vw, 4.6rem); line-height: 1.02; color: var(--gold); text-wrap: balance; max-width: 10ch; opacity: 0; transform: scale(.96); transition: opacity 2s ease .3s, transform 3s ease .3s; }
#s-final p { margin: 0; font-family: var(--mono); font-size: 12px; letter-spacing: .3em; color: var(--gold); opacity: 0; transition: opacity 2s ease 1.6s; font-variant-numeric: tabular-nums; }
#s-final.lit { background: radial-gradient(ellipse at 50% 45%, var(--warm) 0%, var(--bg) 75%); }
#s-final.lit h1 { opacity: 1; transform: none; }
#s-final.lit p { opacity: .75; }
#conf { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; }

/* overlays */
.over { position: fixed; inset: 0; z-index: 20; background: rgba(8,7,6,.92); display: grid; place-items: center; padding: 24px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); }
.over .box { display: grid; gap: 14px; justify-items: center; text-align: center; }
.over h2 { margin: 0; font-family: var(--display); font-weight: 600; font-size: 1.6rem; }
.testp { position: fixed; z-index: 30; right: max(10px, env(safe-area-inset-right, 0px)); bottom: calc(10px + env(safe-area-inset-bottom, 0px)); font-family: var(--mono); font-size: 11px; max-width: calc(100vw - 20px); }
.testp summary { list-style: none; background: #1d1a17; border: 1px solid var(--line); padding: 8px 12px; letter-spacing: .14em; color: var(--gold); cursor: pointer; text-align: right; }
.testp summary::-webkit-details-marker { display: none; }
.testp .tbody { background: #141210; border: 1px solid var(--line); padding: 10px; display: grid; gap: 6px; max-height: 60vh; overflow-y: auto; width: 250px; max-width: 100%; }
.testp button { background: #1f1c19; border: 1px solid var(--line); padding: 8px 10px; text-align: left; font-family: var(--mono); font-size: 11px; color: var(--ink); }
.testp .k { color: var(--gold); }

@keyframes blink { 50% { opacity: 0; } }
@keyframes flick { 0%, 100% { opacity: 1; } 41% { opacity: .55; } 42% { opacity: 1; } 77% { opacity: .8; } 78% { opacity: 1; } }
@keyframes jaw { to { transform: translateY(7px); } }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } }
@keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
@keyframes rattle { 50% { transform: translate(1px, -1px); } }
@keyframes prog { from { transform: scaleX(0); } }
@media (prefers-reduced-motion: reduce) {
  #s-wake .call, #face, #s-wake.grind, .bar .rec i { animation: none; }
  #face.talk #jaw { animation-duration: .5s; }
  .panel.shake { animation: none; }
}
</style>

<canvas id="grain" aria-hidden="true"></canvas>

<button id="s-wake" class="screen" type="button">
  <span class="call">Нажми, если ты меня слышишь…</span>
  <span class="sub" id="wakeSub">звук включи погромче</span>
</button>

<section id="s-play" class="screen" hidden>
  <div class="bar">
    <span class="rec"><i></i>REC</span>
    <button id="lbl" type="button">Плёнка 00</button>
    <span id="clk">0:00:00</span>
  </div>
  <div class="stage" id="stage">
    <svg id="face" viewBox="0 0 200 230" aria-hidden="true">
      <defs>
        <radialGradient id="skin" cx="50%" cy="38%" r="62%">
          <stop offset="0" stop-color="#f2ede3"/>
          <stop offset="1" stop-color="#c9c0b0"/>
        </radialGradient>
      </defs>
      <ellipse class="skin" cx="100" cy="110" rx="66" ry="80"/>
      <path class="hair" d="M34 104 C26 36 174 36 166 104 C152 64 48 64 34 104Z"/>
      <ellipse class="dark" cx="72" cy="104" rx="15" ry="11"/>
      <ellipse class="dark" cx="128" cy="104" rx="15" ry="11"/>
      <circle class="bl-hi" cx="72" cy="105" r="4.2"/>
      <circle class="bl-hi" cx="128" cy="105" r="4.2"/>
      <path class="crease" d="M100 114 L96 130 L104 130"/>
      <path class="spiral" id="cheekL"/>
      <path class="spiral" id="cheekR"/>
      <path class="bl" d="M82 147 Q100 140 118 147 Q100 151 82 147Z"/>
      <g id="jaw">
        <path class="skin" d="M80 148 L80 178 Q100 194 120 178 L120 148 Z"/>
        <path class="crease" d="M80 148 L80 178 Q100 194 120 178 L120 148"/>
        <path class="bl" d="M84 149 Q100 158 116 149 Q100 153 84 149Z"/>
      </g>
      <path class="bl" d="M100 207 L70 193 L70 221 Z M100 207 L130 193 L130 221 Z"/>
      <circle class="bl-hi" cx="100" cy="207" r="5.5"/>
    </svg>
    <div id="photoSlot" hidden></div>
    <div id="subs" aria-live="polite"></div>
    <div class="panel" id="panel" hidden></div>
  </div>
  <div class="foot">
    <button class="ghost" id="btnSkip" type="button" hidden>Пропустить</button>
    <button class="ghost" id="btnRepeat" type="button" hidden>Повторить</button>
    <button class="ghost" id="btnHint" type="button" hidden>Подсказка</button>
  </div>
</section>

<section id="s-final" class="screen" hidden>
  <h1>С днём рождения, Сашуля!</h1>
  <p>04 · 11</p>
</section>
<canvas id="conf" hidden aria-hidden="true"></canvas>

<div class="over" id="resetBox" hidden>
  <div class="box">
    <h2>Начать игру заново?</h2>
    <button class="btn" id="resetYes" type="button">Начать заново</button>
    <button class="ghost" id="resetNo" type="button">Отмена</button>
  </div>
</div>

<script>

/* ===== Звук (заглушки, синтез) ===== */
let ac = null, master = null, noiseBuf = null, drone = null;

  noiseBuf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);

}
function noise() { const s = ac.createBufferSource(); s.buffer = noiseBuf; s.loop = true; return s; }
function env(g, t, a, peak, hold, r) {

  g.gain.exponentialRampToValueAtTime(.0001, t + a + hold + r);
}
function sawGrind(dur = 4.6) {
  if (!ac) return wait(1500);

  bp.type = 'bandpass'; bp.Q.value = 1.4; g.gain.value = .0001;

  const o = ac.createOscillator(), lp = ac.createBiquadFilter(), og = ac.createGain();
  o.type = 'sawtooth'; lp.type = 'lowpass'; lp.frequency.value = 1200; og.gain.value = .0001;

    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.55, t + stroke * .3); g.gain.exponentialRampToValueAtTime(.05, t + stroke * .95);
    o.frequency.setValueAtTime(up ? 95 : 130, t); o.frequency.linearRampToValueAtTime(up ? 130 : 95, t + stroke);
    og.gain.setValueAtTime(.0001, t); og.gain.exponentialRampToValueAtTime(.12, t + stroke * .3); og.gain.exponentialRampToValueAtTime(.01, t + stroke * .95);
    t += stroke; up = !up;

}
function startDrone() {

  o1.frequency.value = 55; o2.frequency.value = 82.5; og.gain.value = .35;

}

  [523.25, 1318.5, 2093, 2637].forEach((f, i) => {
    const o = ac.createOscillator(), g = ac.createGain();
    o.frequency.value = f; env(g, t, .005, .2 / (i + 1), 0, 1.6);

  });

}
function buzz() {

  o.type = 'sawtooth'; o.frequency.value = 62; lp.type = 'lowpass'; lp.frequency.value = 520;

    o.frequency.setValueAtTime(70, t); o.frequency.exponentialRampToValueAtTime(40, t + .15);

    o.frequency.setValueAtTime(1500, t); o.frequency.exponentialRampToValueAtTime(520, t + .07);

  }

/* «С днём рождения» в тёмной аранжировке: до минор, струнное остинато, удары, в конце — мажор */
function melody() {

    if (lpf) { const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = lpf; o.connect(lp).connect(g); } else o.connect(g);
    g.connect(master); env(g, t, .012, peak, Math.max(0, dur - .08), .14);

    const o = ac.createOscillator(), g = ac.createGain();

    env(g, t, .005, big ? .55 : .35, 0, big ? 1.4 : .6); o.connect(g).connect(master); o.start(t); o.stop(t + 1.6);

/* ===== Голос (заглушка: синтез речи браузера) ===== */
const hasTTS = 'speechSynthesis' in window;
let voice = null;
function pickVoice() {
  if (!hasTTS) return;
  const vs = speechSynthesis.getVoices().filter(v => /^ru/i.test(v.lang));
  voice = vs.find(v => /yuri|юрий|pavel|павел|dmitr|дмитр|maxim|максим/i.test(v.name)) || vs.find(v => /google/i.test(v.name)) || vs[0] || null;
}
if (hasTTS) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function unlockTTS() {
  if (!hasTTS) return;
  try { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); } catch (e) {}
}

let run = 0, skipping = false;
const waiters = new Set();
function interruptible(ms) {
  return new Promise(res => {
    if (skipping) return res();
    const w = () => { clearTimeout(t); waiters.delete(w); res(); };
    const t = setTimeout(w, ms); waiters.add(w);
  });
}

function speak(text) {
  const est = Math.max(1400, text.length * 68);
  if (skipping) return Promise.resolve();
  if (fast) return interruptible(200);
  if (!voiceOn || !hasTTS) return interruptible(est);
  return new Promise(res => {
    let done = false;
    const fin = () => { if (done) return; done = true; clearTimeout(t); waiters.delete(fin); res(); };
    const u = new SpeechSynthesisUtterance(text.replace(/…/g, '... ').replace(/—/g, ', '));
    u.lang = 'ru-RU'; if (voice) u.voice = voice; u.rate = .78; u.pitch = .15;
    u.onend = fin; u.onerror = fin;
    const t = setTimeout(fin, est * 2.2 + 2500); waiters.add(fin);
    try { speechSynthesis.speak(u); } catch (e) { fin(); }
  });
}

/* ===== Экран ===== */
const wake = $('#s-wake'), play = $('#s-play'), fin = $('#s-final');
const subs = $('#subs'), panel = $('#panel'), face = $('#face'), stage = $('#stage');
const btnSkip = $('#btnSkip'), btnRepeat = $('#btnRepeat'), btnHint = $('#btnHint');

function spiral(cx, cy) {
  let d = '';
  for (let a = 0; a <= Math.PI * 4.6; a += .22) {
    const r = 1.05 * a;
    d += (a ? 'L' : 'M') + (cx + r * Math.cos(a)).toFixed(1) + ' ' + (cy + r * Math.sin(a)).toFixed(1);
  }
  return d;
}
$('#cheekL').setAttribute('d', spiral(60, 138));
$('#cheekR').setAttribute('d', spiral(140, 138));

async function say(lines, id, noScroll) {
  skipping = false; subs.innerHTML = ''; btnSkip.hidden = false;
  await interruptible(fast ? 0 : 160);
  for (const line of lines) {
    if (id !== run) return false;
    const p = el('p', null, line); subs.appendChild(p);
    for (const c of subs.children) c.classList.toggle('past', c !== p);
    if (!skipping) {
      if (!noScroll) p.scrollIntoView({ block: 'nearest', behavior: reduce ? 'auto' : 'smooth' });
      face.classList.add('talk');
      await speak(line);
      face.classList.remove('talk');
      if (id !== run) return false;
      if (!skipping) await interruptible(fast ? 40 : 420);
    }
  }
  if (id !== run) return false;
  for (const c of subs.children) c.classList.remove('past');
  face.classList.remove('talk'); btnSkip.hidden = true; skipping = false;
  return true;
}
btnSkip.onclick = () => { skipping = true; hush(); releaseWaiters(); };

function setLabel(t) { $('#lbl').textContent = t; }
function lv(L) { return L <= 9 ? CFG.levels[L - 1] : CFG.final; }

function go(stageName, level) { S.stage = stageName; S.level = level; save(); render(); }
function render() {
  run++; const id = run;
  skipping = false; hush(); releaseWaiters();
  panel.innerHTML = ''; panel.hidden = true; subs.innerHTML = '';
  const slot = $('#photoSlot'); slot.innerHTML = ''; slot.hidden = true;
  btnRepeat.hidden = true; btnHint.hidden = true; btnSkip.hidden = true;
  face.classList.remove('talk'); stage.scrollTop = 0;
  if (S.stage === 'final') return finale();
  play.hidden = false; fin.hidden = true;
  if (S.stage === 'intro') return stIntro(id);
  if (S.stage === 'riddle') return stRiddle(id);
  if (S.stage === 'story') return stStory(id);
  if (S.stage === 'rescue') return stRescue(id);
  if (S.stage === 'call') return stCall(id);
}

async function stIntro(id) {
  setLabel('Плёнка 00');
  if (await say(CFG.intro, id)) go('riddle', 1);
}

async function stRiddle(id) {
  const L = S.level, d = lv(L);
  setLabel(L <= 9 ? `Ключ ${L} / 9` : 'Последняя дверь');
  if (d.sfx === 'breath') dripsBreath();
  if (!(await say(d.riddle, id))) return;
  btnRepeat.hidden = false; btnHint.hidden = false;
  panel.hidden = false;
  if (d.show) {
    const n = el('div', 'note'); n.appendChild(el('small', null, d.show.label)); n.appendChild(document.createTextNode(d.show.text));
    panel.appendChild(n);
  }
  const isWord = L > 9;
  const label = el('div', 'cells-label', isWord ? 'Что он хотел тебе сказать' : 'Код с ключа');
  const box = cells(isWord ? [5, 4] : [4], isWord, 'in' + L);
  const msg = el('p', 'msg');
  const ok = el('button', 'btn', 'Открыть'); ok.type = 'button';
  const submit = () => {
    const v = box.value();
    if (isWord ? v === CFG.word : v === d.code) {
      clang(); try { navigator.vibrate && navigator.vibrate([60, 40, 120]); } catch (e) {}
      if (isWord) go('final', 10); else go('story', L);
    } else {
      buzz(); try { navigator.vibrate && navigator.vibrate(200); } catch (e) {}
      const list = isWord ? WRONG_WORD : WRONG;
      msg.textContent = list[Math.floor(Math.random() * list.length)];
      panel.classList.remove('shake'); void panel.offsetWidth; panel.classList.add('shake');
    }

btnRepeat.onclick = () => render();
btnHint.onclick = async () => {
  const d = lv(S.level), h = $('#hintText');

  thump(); h.hidden = false; h.textContent = d.hint;

  skipping = false; face.classList.add('talk'); await speak(d.hint); face.classList.remove('talk');

function cells(groups, isWord, id) {
  const total = groups.reduce((a, b) => a + b, 0);
  const wrap = el('div', 'cells-wrap' + (isWord ? ' word' : ''));
  const boxes = [];
  groups.forEach(n => { const g = el('div', 'cells-group'); for (let i = 0; i < n; i++) { const c = el('div', 'cell'); boxes.push(c); g.appendChild(c); } wrap.appendChild(g); });
  const inp = el('input', 'cells-input'); inp.id = id; inp.type = 'text';
  inp.setAttribute('autocomplete', 'off'); inp.setAttribute('autocorrect', 'off'); inp.setAttribute('spellcheck', 'false');
  inp.setAttribute('aria-label', isWord ? 'Слово' : 'Код');
  if (isWord) inp.setAttribute('autocapitalize', 'characters'); else inp.setAttribute('inputmode', 'numeric');
  wrap.appendChild(inp);
  const norm = s => isWord ? s.toUpperCase().replace(/Ё/g, 'Е').replace(/[^А-Я]/g, '') : s.replace(/\D/g, '');
  const api = { node: wrap, onEnter: null, value: () => norm(inp.value).slice(0, total) };
  const paint = () => {
    const v = api.value(); if (inp.value !== v) inp.value = v;
    boxes.forEach((b, i) => { b.textContent = v[i] || ''; b.classList.toggle('full', !!v[i]); b.classList.toggle('on', i === v.length && document.activeElement === inp); });
  };
  inp.addEventListener('input', paint); inp.addEventListener('focus', paint); inp.addEventListener('blur', paint);
  inp.addEventListener('keydown', e => { if (e.key === 'Enter' && api.onEnter) api.onEnter(); });

}

async function stStory(id) {
  const L = S.level, d = lv(L);
  setLabel(`Ключ ${L} / 9 · найден`);

  else ph.textContent = `Фото № ${L}\n${d.who}`;
  f.append(ph, el('figcaption', null, d.who));
  slot.appendChild(f);
  const lines = d.story ? d.story.slice() : ['Ты нашла фотографию, Сашуля…', 'Помнишь этот день?', `Здесь будет история этого фото: ${d.who}.`];
  if (L === 1) lines.push('Храни эти фотографии, Сашуля. Каждую. Они ещё понадобятся.');

async function stRescue(id) {
  const L = S.level, d = lv(L);
  setLabel(`Ключ ${L} / 9 · свобода`);
  const lines = d.live
    ? [`${d.who} на свободе.`, `Иди ${d.live}. Тебя ждут.`, 'И возвращайся… игра не закончена.']
    : [`${d.who} на свободе.`, 'Посмотри. Это для тебя.'];
  if (!(await say(lines, id, true))) return;
  panel.hidden = false;
  const slot = $('#photoSlot');
  const next = el('button', 'btn', d.live ? 'Я вернулась' : 'Дальше'); next.type = 'button';
  next.onclick = () => { droneTo(DRONE, 1.5); go(d.live ? 'riddle' : 'call', d.live ? L + 1 : L); };
  if (d.live) {
    panel.append(el('p', 'live', 'Когда обнимешь — нажми.'), next);
    return;
  }
  droneTo(.008, .8);
  next.disabled = true;
  if (d.video) {
    const v = el('video', 'real'); v.src = d.video; v.controls = true; v.playsInline = true; v.setAttribute('playsinline', '');
    v.onended = () => { next.disabled = false; };
    setTimeout(() => { next.disabled = false; }, 6000);
    slot.appendChild(v); slot.hidden = false; panel.append(next); stage.scrollTop = 0;
    v.play().catch(() => {});
  } else {
    const box = el('div', 'vid');
    box.append(el('b', null, 'Видео · ' + d.who), el('span', null, 'Здесь будет поздравление'));
    const pr = el('div', 'prog'); pr.appendChild(el('i')); box.appendChild(pr);
    slot.appendChild(box); slot.hidden = false; panel.append(next); stage.scrollTop = 0;
    setTimeout(() => { next.disabled = false; }, fast ? 200 : 4000);
  }
}

async function stCall(id) {
  const L = S.level, d = lv(L);
  setLabel(`Ключ ${L} / 9 · звонок`);
  const lines = ['А теперь позвони.', 'Пусть услышат твой голос… и узнают, что ты пришла за ними.', 'Я подожду.'];
  if (!(await say(lines, id))) return;
  panel.hidden = false;
  const next = el('button', 'btn', 'Я позвонила'); next.type = 'button';
  next.onclick = () => go('riddle', L + 1);
  panel.append(el('p', 'live', 'Позвони: ' + d.who + '. Когда договоришь — нажми.'), next);
}

async function finale() {
  run++; hush(); releaseWaiters(); stopDrone();
  S.stage = 'final'; save();
  play.hidden = true; wake.hidden = true; fin.hidden = false; fin.classList.remove('lit');
  await wait(fast ? 300 : 2600);
  fin.classList.add('lit'); melody(); confetti();
}

function confetti() {
  if (reduce) return;
  const c = $('#conf'), x = c.getContext('2d'); c.hidden = false;
  const W = c.width = innerWidth * devicePixelRatio, H = c.height = innerHeight * devicePixelRatio;
  const cols = ['#f1c27a', '#fff1d6', '#d6282b', '#e9a24c'];
  const P = Array.from({ length: 110 }, () => ({ x: Math.random() * W, y: -Math.random() * H, s: (4 + Math.random() * 6) * devicePixelRatio, v: (1 + Math.random() * 2.2) * devicePixelRatio, r: Math.random() * 6, w: .02 + Math.random() * .06, c: cols[Math.random() * cols.length | 0] }));
  const t0 = performance.now();
  (function tick(now) {
    x.clearRect(0, 0, W, H);
    for (const p of P) {
      p.y += p.v; p.x += Math.sin(p.y / 60) * .6 * devicePixelRatio; p.r += p.w;
      if (p.y > H + 20 && now - t0 < 14000) { p.y = -20; p.x = Math.random() * W; }
      x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.fillStyle = p.c; x.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); x.restore();
    }
    if (now - t0 < 22000) requestAnimationFrame(tick); else c.hidden = true;
  })(t0);
}

/* ===== Часы плёнки ===== */
function startClock() {
  const clk = $('#clk');
  const tick = () => {
    const s = Math.max(0, Math.floor((Date.now() - (S && S.t0 || Date.now())) / 1000));
    clk.textContent = `${Math.floor(s / 3600)}:${String(Math.floor(s / 60) % 60).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
  };
  tick(); setInterval(tick, 1000);
}

/* ===== Не гасить экран ===== */
let lock = null;
async function keepAwake() { try { if (navigator.wakeLock) lock = await navigator.wakeLock.request('screen'); } catch (e) {} }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && started) keepAwake(); });

/* ===== Старт ===== */
if (S && S.stage !== 'intro') $('#wakeSub').textContent = 'игра продолжится с того же места';
function boot() {
  if (started) return; started = true;
  initAudio(); unlockTTS(); keepAwake();
}
wake.addEventListener('click', async () => {
  if (started) return;
  boot();
  if (!S) {
    S = { stage: 'intro', level: 0, t0: Date.now() }; save();
    wake.classList.add('grind');
    await sawGrind();
    wake.hidden = true; startDrone(); startClock(); render();
  } else if (S.stage === 'final') {
    finale();
  } else {
    wake.hidden = true; play.hidden = false; startDrone(); startClock();
    run++; const id = run;
    if (await say(['С возвращением, Сашуля…', 'Продолжим.'], id)) render();
  }
});

/* ===== Сброс: 7 нажатий на номер ключа ===== */
let taps = [];
$('#lbl').onclick = () => {
  const now = Date.now(); taps = taps.filter(t => now - t < 4000); taps.push(now);
  if (taps.length >= 7) { taps = []; $('#resetBox').hidden = false; }
};
$('#resetNo').onclick = () => { $('#resetBox').hidden = true; };
$('#resetYes').onclick = () => { clearSave(); location.reload(); };

/* ===== Режим теста: ссылка с #test ===== */
if (TEST) {
  const d = el('details', 'testp'), sm = el('summary', null, 'ТЕСТ'), b = el('div', 'tbody');
  d.append(sm, b);
  const jump = (stg, L) => {
    if (!started) { boot(); }
    if (!S) S = { t0: Date.now() };
    if (!S.t0) S.t0 = Date.now();
    wake.hidden = true; startDrone(); if (!jump.clock) { startClock(); jump.clock = true; }
    go(stg, L);
  };
  const add = (html, fn) => { const x = el('button'); x.type = 'button'; x.innerHTML = html; x.onclick = fn; b.appendChild(x); };
  add('Вступление', () => jump('intro', 0));
  CFG.levels.forEach((l, i) => add(`${i + 1}. ${l.who} · код <span class="k">${l.code}</span>`, () => jump('riddle', i + 1)));
  add('10. Финал · слово <span class="k">ЛЮБЛЮ ТЕБЯ</span>', () => jump('riddle', 10));
  add('Экран поздравления', () => jump('final', 10));
  const vb = el('button'); vb.type = 'button'; const vt = () => vb.textContent = 'Голос: ' + (voiceOn ? 'вкл' : 'выкл'); vt();
  vb.onclick = () => { voiceOn = !voiceOn; vt(); }; b.appendChild(vb);
  const fb = el('button'); fb.type = 'button'; const ft = () => fb.textContent = 'Быстро: ' + (fast ? 'вкл' : 'выкл'); ft();
  fb.onclick = () => { fast = !fast; ft(); }; b.appendChild(fb);
  add('Сбросить прогресс', () => { clearSave(); location.reload(); });
  document.body.appendChild(d);
}

/* ===== Плёночное зерно ===== */
(function grain() {
  const c = $('#grain'), x = c.getContext('2d'); c.width = 140; c.height = 250;
  const draw = () => {
    const im = x.createImageData(c.width, c.height), p = im.data;
    for (let i = 0; i < p.length; i += 4) { const v = Math.random() * 255 | 0; p[i] = p[i + 1] = p[i + 2] = v; p[i + 3] = 255; }
    x.putImageData(im, 0, 0);
  };
  draw(); if (!reduce) setInterval(draw, 90);
})();
