<meta charset="utf-8">
<title>Игра для Сашули</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Игра">
<meta name="theme-color" content="#0c0b0a">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
/* Layout: one phone screen like a tape playback — counter strip on top, the puppet and its words in the middle, controls at the thumb. Single dark world; the finale flips to warm light. */
:root {
  color-scheme: dark;
  --bg: #0c0b0a;
  --ink: #e9e3d7;
  --dim: #958d80;
  --line: #2c2824;
  --paper: #e6dfd1;
  --paper-ink: #1d1a17;
  --blood: #a3191b;
  --blood-hi: #d6282b;
  --gold: #f1c27a;
  --warm: #3a1f0c;
  --display: "Cormorant Garamond", "Times New Roman", Georgia, serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--body);
  font-size: 15px;
  overflow: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color: transparent;
}
body::after {
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 4;
  background: radial-gradient(ellipse at 50% 42%, transparent 45%, rgba(0,0,0,.72) 100%);
}
#grain { position: fixed; inset: 0; width: 100%; height: 100%; opacity: .07; pointer-events: none; z-index: 5; mix-blend-mode: screen; image-rendering: pixelated; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

.screen { height: 100%; display: flex; flex-direction: column; position: relative; z-index: 1; }

/* wake */
#s-wake { align-items: center; justify-content: center; text-align: center; gap: 18px; border: 0; background: transparent; width: 100%; cursor: pointer; }
#restart { position: absolute; left: 50%; bottom: max(28px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); white-space: nowrap; }
#s-wake .call { font-family: var(--display); font-style: italic; font-weight: 500; font-size: clamp(1.5rem, 6.4vw, 2.1rem); line-height: 1.3; max-width: 18ch; text-wrap: balance; animation: flick 6s infinite steps(1); }
#s-wake .sub { font-family: var(--mono); font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--dim); }
#s-wake.grind { animation: rattle .09s infinite; }
#s-wake.grind .call, #s-wake.grind .sub { opacity: 0; transition: opacity 1.2s; }
#s-wake.loading { cursor: progress; }
.load { width: min(64vw, 240px); height: 3px; margin-top: 10px; background: var(--line); overflow: hidden; }
.load i { display: block; height: 100%; width: 100%; background: var(--blood-hi); transform-origin: left; transform: scaleX(0); transition: transform .35s linear; }
#loadTxt { font-variant-numeric: tabular-nums; margin-top: -8px; }

/* play */
.bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: max(14px, env(safe-area-inset-top, 0px)) 8px; font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); font-variant-numeric: tabular-nums; }
.bar .rec { display: inline-flex; align-items: center; gap: 7px; color: var(--blood-hi); }
.bar .rec i { width: 8px; height: 8px; border-radius: 50%; background: var(--blood-hi); animation: blink 1.2s infinite steps(1); }
#lbl { background: none; border: 0; padding: 4px 0; letter-spacing: inherit; text-transform: inherit; color: var(--ink); }
.stage { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; align-items: center; gap: 18px; padding-block: 6px 18px; scrollbar-width: none; }
.stage::-webkit-scrollbar { display: none; }
.stage > * { flex-shrink: 0; }
#face { width: min(50vw, 220px); max-width: 100%; height: auto; flex: none; animation: flick 9s infinite steps(1), facelit 5s ease-in-out infinite alternate; }
#face.glitch { animation: faceglitch .45s steps(1); }
#lamp { position: absolute; z-index: -1; left: 50%; top: -14vh; width: 150vw; height: 90vh; pointer-events: none; transform-origin: 50% 0; transform: translateX(-50%); animation: sway 5s ease-in-out infinite alternate;
  background: radial-gradient(ellipse 34% 62% at 50% 0%, rgba(255,230,185,.17), rgba(255,230,185,.05) 48%, transparent 72%); }
.locks { display: flex; justify-content: center; gap: 7px; padding-block: 0 4px; }
.lk { width: 14px; height: 18px; overflow: visible; }
.lk rect { fill: #2c2824; transition: fill .4s; }
.lk .sh { fill: none; stroke: #4a433b; stroke-width: 2; transition: transform .5s, stroke .4s; }
.lk.open rect { fill: var(--gold); }
.lk.open .sh { stroke: var(--gold); transform: translateY(-3px); }
.lk.pop { animation: pop .9s ease-out; }
.kw { color: var(--blood-hi); font-style: normal; }

#subs { width: 100%; max-width: 30ch; display: flex; flex-direction: column; gap: 6px; text-align: center; min-height: 3em; }
#subs p { margin: 0; font-family: var(--display); font-weight: 500; font-size: clamp(1.3rem, 5.6vw, 1.7rem); line-height: 1.3; text-wrap: balance; animation: rise .5s ease-out; transition: opacity .4s; }
#subs p.past { opacity: .36; }

.panel { width: 100%; max-width: 400px; display: grid; gap: 14px; justify-items: center; }
.panel.shake { animation: shake .4s; }
.note { background: var(--paper); color: var(--paper-ink); padding: 14px 18px 16px; transform: rotate(-1.2deg); box-shadow: 0 8px 24px rgba(0,0,0,.5); font-family: var(--mono); font-size: 1.05rem; letter-spacing: .06em; text-align: center; max-width: 100%; overflow-wrap: anywhere; white-space: pre-line; line-height: 1.6; }
.note small { display: block; font-size: 10px; letter-spacing: .2em; text-transform: uppercase; opacity: .55; margin-bottom: 6px; }

.cells-wrap { position: relative; display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
.cells-group { display: flex; gap: 6px; }
.cell { width: 2.6rem; height: 3.2rem; display: grid; place-items: center; border: 1px solid var(--line); background: #141210; font-family: var(--mono); font-size: 1.5rem; font-weight: 500; color: var(--ink); transition: border-color .2s; }
.cells-wrap.word .cell { width: 2.1rem; height: 2.8rem; font-size: 1.25rem; }
.cell { overflow: hidden; }
.cell span { display: block; animation: roll .3s ease-out; }
.cells-wrap.drum .cells-group { padding: 7px; background: linear-gradient(#26211c, #14110f); border: 1px solid #3d362f; border-radius: 6px; box-shadow: 0 6px 18px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.06); }
.cells-wrap.drum .cell { border-radius: 3px; border-color: #4a433b; background: linear-gradient(#030303 0%, #2a2520 22%, #3d3731 50%, #2a2520 78%, #030303 100%); text-shadow: 0 1px 0 #000; }
.cells-wrap.drum .cell.full { border-color: var(--blood); }
.cell.on { border-color: var(--dim); }
.cell.full { border-color: var(--blood); }
.cells-input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; font-size: 16px; border: 0; background: transparent; color: transparent; caret-color: transparent; }
.cells-label { font-family: var(--mono); font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--dim); }
.msg { min-height: 1.4em; margin: 0; font-family: var(--display); font-style: italic; font-size: 1.15rem; color: var(--blood-hi); text-align: center; }
.hint { margin: 0; font-family: var(--display); font-style: italic; font-size: 1.15rem; color: var(--ink); text-align: center; border-top: 1px solid var(--line); padding-top: 12px; max-width: 30ch; }

.btn { border: 0; background: var(--blood); color: #fff4e6; padding: 14px 26px; font-family: var(--mono); font-size: 13px; font-weight: 500; letter-spacing: .16em; text-transform: uppercase; min-width: 12rem; }
.btn:active { background: var(--blood-hi); }
.btn:disabled { background: #3a2a29; color: #c2b9ab; }
.ghost { border: 1px solid var(--line); background: transparent; padding: 10px 14px; font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); }
.ghost:active { color: var(--ink); border-color: var(--dim); }
.foot { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; padding-block: 8px max(14px, env(safe-area-inset-bottom, 0px)); min-height: 58px; }

.polaroid { margin: 0; background: var(--paper); padding: 10px 10px 12px; width: min(72vw, 260px); transform: rotate(2deg); box-shadow: 0 10px 30px rgba(0,0,0,.6); position: relative; }
.polaroid::before { content: ""; position: absolute; top: -10px; left: 50%; width: 70px; height: 20px; transform: translateX(-50%) rotate(-3deg); background: rgba(230,223,209,.55); }
.polaroid .ph { aspect-ratio: 4 / 3; max-width: 100%; background: #2a2622; display: grid; place-items: center; color: var(--dim); font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; text-align: center; padding: 8px; overflow: hidden; animation: develop 7s ease-out both; }
.polaroid::after { content: ""; position: absolute; inset: 0; pointer-events: none; mix-blend-mode: multiply;
  background: radial-gradient(circle at 92% 8%, rgba(120,62,28,.45), transparent 16%), radial-gradient(circle at 6% 88%, rgba(110,55,25,.35), transparent 14%), radial-gradient(ellipse at 70% 96%, rgba(90,40,20,.3), transparent 22%); }
.polaroid .ph img { width: 100%; height: 100%; object-fit: cover; }
/* фото целиком, в своих пропорциях: горизонтальные снимки не режем по краям */
.polaroid .ph:has(img), .mini .ph:has(img) { aspect-ratio: auto; padding: 0; display: block; }
.polaroid .ph:has(img) img, .mini .ph:has(img) img { display: block; height: auto; }
.polaroid figcaption { color: var(--paper-ink); font-family: var(--display); font-style: italic; font-size: 1.2rem; text-align: center; padding-top: 8px; }

.tv { position: relative; width: min(66vw, 250px); max-width: 100%; padding: 14px 14px 32px; border-radius: 18px; background: linear-gradient(145deg, #3d342b, #1c1814); box-shadow: 0 16px 40px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.09); }
.tv-screen { position: relative; overflow: hidden; border-radius: 22px / 14px; background: #000; box-shadow: inset 0 0 30px rgba(0,0,0,.9); }
.tv-screen::after { content: ""; position: absolute; inset: 0; pointer-events: none; animation: scan 7s linear infinite;
  background: repeating-linear-gradient(0deg, rgba(0,0,0,.3) 0 1px, transparent 1px 3px), linear-gradient(transparent 0 45%, rgba(255,255,255,.05) 45% 52%, transparent 52%), radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(0,0,0,.6));
  background-size: 100% 100%, 100% 300%, 100% 100%; }
.tv-knobs { position: absolute; right: 18px; bottom: 9px; display: flex; gap: 8px; }
.tv-knobs i { width: 13px; height: 13px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #75685a, #221d18); }
.tv-knobs b { position: absolute; right: 52px; bottom: 3px; width: 6px; height: 6px; border-radius: 50%; background: var(--blood-hi); box-shadow: 0 0 6px var(--blood-hi); }
.tv video.real { display: block; width: 100%; max-height: 46vh; }
.tvplay { position: absolute; inset: 0; z-index: 2; border: 0; background: rgba(0,0,0,.55); color: var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; font-family: var(--mono); font-size: 11px; letter-spacing: .18em; text-transform: uppercase; }
.tvplay[hidden] { display: none; }
.tvplay i { width: 74px; height: 74px; border-radius: 50%; border: 2px solid var(--blood-hi); box-shadow: 0 0 18px rgba(200,30,30,.5); display: flex; align-items: center; justify-content: center; font-style: normal; font-size: 30px; padding-left: 6px; color: var(--blood-hi); }
.vid { width: 100%; aspect-ratio: 9 / 16; max-height: 46vh; max-width: 100%; background: #000; border: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; padding: 14px; }
.vid b { font-family: var(--mono); font-weight: 500; font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--blood-hi); }
.vid span { font-family: var(--display); font-style: italic; font-size: 1.15rem; color: var(--ink); }
.vid .prog { width: 70%; height: 2px; background: var(--line); overflow: hidden; }
.vid .prog i { display: block; height: 100%; width: 100%; background: var(--ink); transform-origin: left; animation: prog 4s linear forwards; }
video.real { width: min(72vw, 280px); max-height: 52vh; max-width: 100%; background: #000; }
.live { font-family: var(--display); font-style: italic; font-size: 1.2rem; text-align: center; color: var(--dim); margin: 0; }

/* final */
#s-final { align-items: center; justify-content: center; text-align: center; gap: 16px; background: var(--bg); transition: background 2.4s ease; }
#collage { position: absolute; inset: 0; transition: filter 2s ease; }
#collage.dim { filter: brightness(.3) blur(1.5px); }
.mini { position: absolute; width: min(28vw, 140px); background: var(--paper); padding: 6px 6px 8px; box-shadow: 0 8px 20px rgba(0,0,0,.6); transform: translate(-50%, -50%) rotate(var(--r)); animation: drop .75s cubic-bezier(.2,.8,.3,1.12) both; }
.mini .ph { aspect-ratio: 1; background: #2a2622; display: grid; place-items: center; overflow: hidden; color: var(--dim); font-family: var(--mono); font-size: 9px; letter-spacing: .12em; text-transform: uppercase; text-align: center; padding: 4px; }
.mini .ph img { width: 100%; height: 100%; object-fit: cover; }
.mini b { display: block; padding-top: 5px; font-family: var(--display); font-style: italic; font-weight: 500; font-size: .95rem; color: var(--paper-ink); text-align: center; }
#s-final h1, #s-final p { position: relative; z-index: 1; text-shadow: 0 2px 28px rgba(0,0,0,.9); }
#s-final h1 { margin: 0; font-family: var(--display); font-weight: 600; font-size: clamp(2.6rem, 13vw, 4.6rem); line-height: 1.02; color: var(--gold); text-wrap: balance; max-width: 10ch; opacity: 0; transform: scale(.96); transition: opacity 2s ease .3s, transform 3s ease .3s; }
#s-final p { margin: 0; font-family: var(--mono); font-size: 12px; letter-spacing: .3em; color: var(--gold); opacity: 0; transition: opacity 2s ease 1.6s; font-variant-numeric: tabular-nums; }
#s-final.lit { background: radial-gradient(ellipse at 50% 45%, var(--warm) 0%, var(--bg) 75%); }
#s-final.lit h1 { opacity: 1; transform: none; }
#s-final.lit p { opacity: .75; }
#conf { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; }

/* overlays */
.over { position: fixed; inset: 0; z-index: 20; background: rgba(8,7,6,.92); display: grid; place-items: center; padding: 24px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); }
.over .box { display: grid; gap: 14px; justify-items: center; text-align: center; }
.over h2 { margin: 0; font-family: var(--display); font-weight: 600; font-size: 1.6rem; }
.testp { position: fixed; z-index: 30; right: max(10px, env(safe-area-inset-right, 0px)); bottom: calc(10px + env(safe-area-inset-bottom, 0px)); font-family: var(--mono); font-size: 11px; max-width: calc(100vw - 20px); }
.testp summary { list-style: none; background: #1d1a17; border: 1px solid var(--line); padding: 8px 12px; letter-spacing: .14em; color: var(--gold); cursor: pointer; text-align: right; }
.testp summary::-webkit-details-marker { display: none; }
.testp .tbody { background: #141210; border: 1px solid var(--line); padding: 10px; display: grid; gap: 6px; max-height: 60vh; overflow-y: auto; width: 250px; max-width: 100%; }
.testp button { background: #1f1c19; border: 1px solid var(--line); padding: 8px 10px; text-align: left; font-family: var(--mono); font-size: 11px; color: var(--ink); }
.testp .k { color: var(--gold); }

@keyframes blink { 50% { opacity: 0; } }
@keyframes flick { 0%, 100% { opacity: 1; } 41% { opacity: .55; } 42% { opacity: 1; } 77% { opacity: .8; } 78% { opacity: 1; } }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } }
@keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
@keyframes rattle { 50% { transform: translate(1px, -1px); } }
@keyframes prog { from { transform: scaleX(0); } }
@keyframes facelit { from { filter: brightness(.8) drop-shadow(-14px 12px 16px rgba(0,0,0,.65)); } to { filter: brightness(1.06) drop-shadow(14px 12px 16px rgba(0,0,0,.65)); } }
@keyframes sway { from { transform: translateX(-50%) rotate(-8deg); } to { transform: translateX(-50%) rotate(8deg); } }
@keyframes faceglitch { 0% { transform: translateX(-7px) skewX(6deg); filter: drop-shadow(4px 0 rgba(255,0,0,.8)) drop-shadow(-4px 0 rgba(0,255,255,.6)); } 25% { transform: translateX(6px); filter: hue-rotate(90deg) contrast(1.6); } 50% { transform: translate(-3px, 2px) skewX(-4deg); filter: drop-shadow(-5px 0 rgba(255,0,0,.8)) drop-shadow(5px 0 rgba(0,255,255,.6)); } 75% { transform: translateX(2px); filter: invert(.15); } 100% { transform: none; filter: none; } }
@keyframes pop { 0% { transform: scale(1); filter: none; } 35% { transform: scale(1.7); filter: drop-shadow(0 0 6px var(--gold)); } 100% { transform: scale(1); filter: none; } }
@keyframes roll { from { transform: translateY(-110%); filter: blur(2px); } 65% { transform: translateY(12%); filter: none; } to { transform: none; } }
@keyframes develop { 0% { filter: brightness(.12) sepia(1) contrast(.5) blur(3px); } 40% { filter: brightness(.55) sepia(.8) contrast(.8) blur(1px); } 100% { filter: none; } }
@keyframes scan { to { background-position: 0 0, 0 300%, 0 0; } }
@keyframes drop { from { transform: translate(-50%, -150vh) rotate(calc(var(--r) + 35deg)); } to { transform: translate(-50%, -50%) rotate(var(--r)); } }
@keyframes vhs { 0% { opacity: 1; background-position: 0 0, 0 -40vh; } 45% { opacity: .9; background-position: 0 4px, 0 35vh; } 100% { opacity: 0; background-position: 0 0, 0 95vh; } }
@keyframes vjit { 0% { transform: translateX(-9px) skewX(5deg); filter: contrast(1.5) saturate(0) brightness(1.35); } 25% { transform: translateX(7px); } 50% { transform: translateX(-4px) skewX(-3deg); filter: none; } 100% { transform: none; } }
@keyframes flash { from { opacity: .45; } to { opacity: 0; } }
@keyframes lidT { 0% { transform: translateY(0); } 22% { transform: translateY(-55%); } 36% { transform: translateY(-4%); } 55% { transform: translateY(-42%); } 66% { transform: translateY(-22%); } 100% { transform: translateY(-106%); } }
@keyframes lidB { 0% { transform: translateY(0); } 22% { transform: translateY(55%); } 36% { transform: translateY(4%); } 55% { transform: translateY(42%); } 66% { transform: translateY(22%); } 100% { transform: translateY(106%); } }
@keyframes unblur { 0% { filter: blur(12px) brightness(.45); } 60% { filter: blur(4px) brightness(.8); } 100% { filter: none; } }

#vhs { position: fixed; inset: 0; z-index: 16; pointer-events: none; opacity: 0;
  background: repeating-linear-gradient(0deg, rgba(255,255,255,.07) 0 1px, transparent 1px 3px), linear-gradient(transparent 0 40%, rgba(255,255,255,.2) 40% 43%, transparent 43% 70%, rgba(214,40,43,.18) 70% 71.5%, transparent 71.5%);
  background-size: 100% 100%, 100% 100%; }
#vhs.on { animation: vhs .5s steps(6) forwards; }
body.vhs-on .screen { animation: vjit .5s steps(5); }
#flash { position: fixed; inset: 0; z-index: 15; pointer-events: none; background: var(--blood-hi); opacity: 0; }
#flash.on { animation: flash .4s ease-out forwards; }
#lids { position: fixed; inset: 0; z-index: 17; pointer-events: none; }
.lid { position: absolute; left: -10%; right: -10%; height: 56%; background: #000; }
.lid.top { top: 0; border-radius: 0 0 50% 50% / 0 0 26% 26%; animation: lidT 3s ease-in-out forwards; }
.lid.bot { bottom: 0; border-radius: 50% 50% 0 0 / 26% 26% 0 0; animation: lidB 3s ease-in-out forwards; }
#s-play.waking { animation: unblur 3.2s ease-out; }

@media (prefers-reduced-motion: reduce) {
  #s-wake .call, #face, #s-wake.grind, .bar .rec i, #lamp, .tv-screen::after { animation: none; }
  .panel.shake, body.vhs-on .screen, .mini, .cell span, .polaroid .ph { animation: none; }
}
</style>

<canvas id="grain" aria-hidden="true"></canvas>

<div id="s-wake" class="screen loading" role="button" tabindex="0" aria-disabled="true">
  <span class="call" id="wakeCall">Приготовься, Сашуля…</span>
  <span class="sub" id="wakeSub">у тебя есть время собраться</span>
  <div class="load" id="load" role="progressbar" aria-label="Загрузка" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="loadBar"></i></div>
  <span class="sub" id="loadTxt">плёнка заряжается · 0%</span>
  <button class="ghost" id="restart" type="button" hidden>Начать заново</button>
</div>

<section id="s-play" class="screen" hidden>
  <div id="lamp" aria-hidden="true"></div>
  <div class="bar">
    <span class="rec"><i></i>REC</span>
    <button id="lbl" type="button">Плёнка 00</button>
    <span id="clk">0:00:00</span>
  </div>
  <div class="locks" id="locks" role="img" aria-label="Спасено 0 из 9"></div>
  <div class="stage" id="stage">
    <canvas id="face" width="400" height="406" aria-hidden="true"></canvas>
    <div id="photoSlot" hidden></div>
    <div id="subs" aria-live="polite"></div>
    <div class="panel" id="panel" hidden></div>
  </div>

    g.connect(master); env(g, t, .012, peak, Math.max(0, dur - .08), .14);
    o.start(t); o.stop(t + dur + .3);
  };
  const boom = (t, big) => {
    const o = ac.createOscillator(), g = ac.createGain();
    o.frequency.setValueAtTime(big ? 70 : 60, t); o.frequency.exponentialRampToValueAtTime(32, t + .5);
    env(g, t, .005, big ? .55 : .35, 0, big ? 1.4 : .6); o.connect(g).connect(master); o.start(t); o.stop(t + 1.6);
    const n = noise(), lp = ac.createBiquadFilter(), ng = ac.createGain();
    lp.type = 'lowpass'; lp.frequency.value = 700; env(ng, t, .002, big ? .3 : .18, 0, .25);
    n.connect(lp).connect(ng).connect(master); n.start(t); n.stop(t + .4);
  };
  const CH = { Cm: [48, 51, 55], G: [43, 47, 50], G7: [43, 47, 53], Fm: [41, 44, 48] };
  const bar = (name, t, vol) => {
    const [r, th, fi] = CH[name];
    [r + 12, fi + 12, r + 24, th + 24, r + 24, fi + 12].forEach((m, i) =>
      tone('sawtooth', hz(m), t + i * beat / 2, beat * .36, .045 * vol, 1700, i % 2 ? 7 : -7));
    tone('sawtooth', hz(r - 12), t, beat * 3, .09 * vol, 320);
  };
  bar('Cm', t0, .5); bar('Cm', t0 + 3 * beat, .85); boom(t0 + 3 * beat);
  const mel = t0 + 5 * beat;
  ['Cm', 'G', 'G', 'Cm', 'Cm', 'Fm', 'G7'].forEach((c, k) => {
    const t = mel + beat + k * 3 * beat;
    bar(c, t, 1); if (k % 2 === 0) boom(t);
  });
  const end = mel + beat + 7 * 3 * beat;
  [48, 52, 55, 60, 64].forEach(m => tone('sawtooth', hz(m), end, beat * 5, .05, 1400));
  [84, 88, 91].forEach(m => tone('sine', hz(m), end + .05, beat * 4, .025));
  boom(end, true);
  const N = [[67,.75],[67,.25],[68,1],[67,1],[72,1],[71,2],[67,.75],[67,.25],[68,1],[67,1],[74,1],[72,2],
             [67,.75],[67,.25],[79,1],[75,1],[72,1],[71,1],[68,1],[77,.75],[77,.25],[75,1],[72,1],[74,1],[72,3]];
  let t = mel;
  for (const [m, d] of N) {
    const dur = d * beat;
    tone('triangle', hz(m), t, dur * .95, .2);
    tone('sine', hz(m) * 2, t, dur * .6, .04, 0, 9);
    t += dur;
  }
}

/* ===== Голос: записи Билли из voice/, запасной — синтез речи браузера ===== */
const hasTTS = 'speechSynthesis' in window;
let voice = null;
function pickVoice() {
  if (!hasTTS) return;
  const vs = speechSynthesis.getVoices().filter(v => /^ru/i.test(v.lang));
  voice = vs.find(v => /yuri|юрий|pavel|павел|dmitr|дмитр|maxim|максим/i.test(v.name)) || vs.find(v => /google/i.test(v.name)) || vs[0] || null;
}
if (hasTTS) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function unlockTTS() {
  if (!hasTTS) return;
  try { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); } catch (e) {}
}

let run = 0, skipping = false;
const waiters = new Set();
function interruptible(ms) {
  return new Promise(res => {
    if (skipping) return res();
    const w = () => { clearTimeout(t); waiters.delete(w); res(); };
    const t = setTimeout(w, ms); waiters.add(w);
  });
}
function releaseWaiters() { [...waiters].forEach(w => w()); }
function hush() {
  try { if (hasTTS) speechSynthesis.cancel(); } catch (e) {}
  if (voiceSrc) { try { voiceSrc.stop(); } catch (e) {} voiceSrc = null; }
}

/* Записанный голос: голос/build.py озвучивает реплики в voice/<ключ>.mp3, ключ — FNV-1a от текста */
const voiceRaw = {}, voiceBuf = {};
let voiceSrc = null, voiceAn = null, voiceWave = null;
function voiceKey(s) {
  let h = 0x811c9dc5;
  for (let i = 0; i < s.length; i++) h = Math.imul(h ^ s.charCodeAt(i), 0x01000193) >>> 0;
  return h.toString(16).padStart(8, '0');
}
function voiceDecode(k) {
  if (!voiceBuf[k]) voiceBuf[k] = new Promise((ok, no) => ac.decodeAudioData(voiceRaw[k].slice(0), ok, no)).catch(() => null);
  return voiceBuf[k];
}
async function speakRec(k) {
  const buf = await voiceDecode(k);
  if (!buf || skipping) return !!buf;
  if (!voiceAn) {
    voiceAn = ac.createAnalyser(); voiceAn.fftSize = 512; voiceWave = new Float32Array(voiceAn.fftSize);
    voiceAn.connect(master);
  }
  await new Promise(res => {
    let done = false;
    const s = ac.createBufferSource(); s.buffer = buf; s.connect(voiceAn);
    const fin = () => { if (done) return; done = true; waiters.delete(fin); if (voiceSrc === s) { try { s.stop(); } catch (e) {} voiceSrc = null; } res(); };
    s.onended = fin; waiters.add(fin); voiceSrc = s; s.start();
  });
  return true;
}
/* громкость голоса прямо сейчас, 0…1 — по ней открывается челюсть */
function voiceLevel() {
  if (!voiceSrc || !voiceAn) return -1;
  voiceAn.getFloatTimeDomainData(voiceWave);
  let sum = 0; for (const v of voiceWave) sum += v * v;
  return Math.min(1, Math.max(0, Math.sqrt(sum / voiceWave.length) * 6 - .12));
}

async function speak(text) {
  const est = Math.max(1400, text.length * 68);
  if (skipping) return;
  if (fast) return interruptible(200);
  const k = voiceKey(text);
  if (voiceOn && ac && voiceRaw[k] && await speakRec(k)) return;
  if (!voiceOn || !hasTTS) return interruptible(est);
  return new Promise(res => {
    let done = false;
    const fin = () => { if (done) return; done = true; clearTimeout(t); waiters.delete(fin); res(); };
    const u = new SpeechSynthesisUtterance(text.replace(/…/g, '... ').replace(/—/g, ', '));
    u.lang = 'ru-RU'; if (voice) u.voice = voice; u.rate = .78; u.pitch = .15;
    u.onend = fin; u.onerror = fin;
    const t = setTimeout(fin, est * 2.2 + 2500); waiters.add(fin);
    try { speechSynthesis.speak(u); } catch (e) { fin(); }
  });
}

faceImg.onload = () => {
  try {
    const c = document.createElement('canvas'); c.width = FACE_W; c.height = FACE_H;
    const x = c.getContext('2d'); x.drawImage(faceImg, 0, 0, FACE_W, FACE_H);
    const im = x.getImageData(0, 0, FACE_W, FACE_H), p = im.data;
    for (let i = 0; i < p.length; i += 4) { const m = Math.max(p[i], p[i + 1], p[i + 2]); if (m < 40) p[i + 3] = Math.max(0, (m - 16) * 10.6); }

function drawFace(now) {

function cells(groups, isWord, id) {

  const boxes = [];
  groups.forEach(n => { const g = el('div', 'cells-group'); for (let i = 0; i < n; i++) { const c = el('div', 'cell'); boxes.push(c); g.appendChild(c); } wrap.appendChild(g); });

  inp.setAttribute('autocomplete', 'off'); inp.setAttribute('autocorrect', 'off'); inp.setAttribute('spellcheck', 'false');

  wrap.appendChild(inp);
  const norm = s => isWord ? s.toUpperCase().replace(/Ё/g, 'Е').replace(/[^А-Я]/g, '') : s.replace(/\D/g, '');
  const api = { node: wrap, onEnter: null, value: () => norm(inp.value).slice(0, total) };
  let prev = '';
  const paint = () => {
    const v = api.value(); if (inp.value !== v) inp.value = v;
    if (v.length > prev.length) tick();
    boxes.forEach((b, i) => {
      if ((v[i] || '') !== (prev[i] || '')) { b.textContent = ''; if (v[i]) b.appendChild(el('span', null, v[i])); }
      b.classList.toggle('full', !!v[i]); b.classList.toggle('on', i === v.length && document.activeElement === inp);

  };
  inp.addEventListener('input', paint); inp.addEventListener('focus', paint); inp.addEventListener('blur', paint);
  inp.addEventListener('keydown', e => { if (e.key === 'Enter' && api.onEnter) api.onEnter(); });
  return api;
}

  const P = Array.from({ length: 110 }, () => ({ x: Math.random() * W, y: -Math.random() * H, s: (4 + Math.random() * 6) * devicePixelRatio, v: (1 + Math.random() * 2.2) * devicePixelRatio, r: Math.random() * 6, w: .02 + Math.random() * .06, c: cols[Math.random() * cols.length | 0] }));

}

/* ===== Предзагрузка: пока Сашуля собирается, видео, фото и песня скачиваются в память целиком ===== */
let ready = false, songData = null;
async function preload() {
  const items = [];
  try {
    const keys = await (await fetch('voice/index.json', { cache: 'no-cache' })).json();
    keys.forEach(k => items.push({ url: `voice/${k}.mp3`, voice: k }));
  } catch (e) { /* записей нет — Билли говорит голосом браузера */ }
  CFG.levels.forEach(d => {
    if (d.video) items.push({ url: d.video, set: u => { d.video = u; } });
    if (d.photo && !/^data:/.test(d.photo)) items.push({ url: d.photo, set: u => { d.photo = u; } });
  });
  if (CFG.finalSong) items.push({ url: CFG.finalSong, song: true });
  items.forEach(it => { it.got = 0; it.total = 0; it.done = false; });
  const bar = $('#loadBar'), txt = $('#loadTxt'), box = $('#load');
  let shown = 0, last = Date.now();
  const show = () => {
    /* пока сервер не назвал размер файла, считаем реплику в 40 КБ, остальное в 6 МБ */
    const all = items.reduce((s, it) => s + (it.done ? it.got : it.total || Math.max(it.voice ? 4e4 : 6e6, it.got * 1.3)), 0);
    const got = items.reduce((s, it) => s + it.got, 0);
    shown = Math.max(shown, items.length ? Math.min(1, got / all) : 1);
    const p = Math.floor(shown * 100);
    bar.style.transform = `scaleX(${shown})`; txt.textContent = `плёнка заряжается · ${p}%`; box.setAttribute('aria-valuenow', p);
  };
  const grab = async it => {
    try {
      const r = await fetch(it.url); if (!r.ok) throw new Error(r.status);
      it.total = +r.headers.get('content-length') || 0;
      const type = r.headers.get('content-type') || (/\.mp4$/i.test(it.url) ? 'video/mp4' : '');
      const parts = [], rd = r.body && r.body.getReader();
      if (rd) for (;;) { const { done, value } = await rd.read(); if (done) break; parts.push(value); it.got += value.length; last = Date.now(); show(); }
      else { const b = await r.blob(); parts.push(b); it.got = b.size; }
      const blob = new Blob(parts, { type });
      if (it.song) songData = await blob.arrayBuffer();
      else if (it.voice) voiceRaw[it.voice] = await blob.arrayBuffer();
      else it.set(URL.createObjectURL(blob));
    } catch (e) { /* не скачалось — останется ссылка на сайт, догрузится по ходу */ }
    it.done = true; show();
  };
  const minWait = wait(fast ? 0 : 1800);
  /* если сеть встала на 20 с — не держим Сашулю, пускаем в игру */
  const stall = new Promise(ok => { const t = setInterval(() => { if (Date.now() - last > 20000) { clearInterval(t); ok(); } }, 1000); });
  show();
  Promise.race([Promise.all(items.map(grab)), stall]).then(() => minWait).then(() => {
    shown = 1; bar.style.transform = 'scaleX(1)';
    setTimeout(() => {
      ready = true; wake.classList.remove('loading'); wake.removeAttribute('aria-disabled');
      box.hidden = true; txt.hidden = true;
      $('#wakeCall').textContent = 'Нажми, если ты меня слышишь…';
      $('#wakeSub').textContent = S && S.stage !== 'intro' ? 'игра продолжится с того же места' : 'звук включи погромче';
    }, 450);
  });
}

  const vb = el('button'); vb.type = 'button'; const vt = () => vb.textContent = 'Голос: ' + (voiceOn ? 'вкл' : 'выкл'); vt();
  vb.onclick = () => { voiceOn = !voiceOn; vt(); }; b.appendChild(vb);
  const fb = el('button'); fb.type = 'button'; const ft = () => fb.textContent = 'Быстро: ' + (fast ? 'вкл' : 'выкл'); ft();
  fb.onclick = () => { fast = !fast; ft(); }; b.appendChild(fb);
  add('Сбросить прогресс', () => { clearSave(); location.reload(); });
  document.body.appendChild(d);
}

/* ===== Плёночное зерно ===== */
(function grain() {
  const c = $('#grain'), x = c.getContext('2d'); c.width = 140; c.height = 250;
  const draw = () => {
    const im = x.createImageData(c.width, c.height), p = im.data;
    for (let i = 0; i < p.length; i += 4) { const v = Math.random() * 255 | 0; p[i] = p[i + 1] = p[i + 2] = v; p[i + 3] = 255; }
    x.putImageData(im, 0, 0);
  };
  draw(); if (!reduce) setInterval(draw, 90);
})();
